# Local development infrastructure for Chronolignee.
# Application code runs on the host through pnpm for fast iteration;
# only stateful services live in containers.
#
#   pnpm infra:up      start
#   pnpm infra:down    stop (keeps data)
#   pnpm infra:nuke    stop and DELETE all local data

name: chronolignee

services:
  postgres:
    # PostGIS image tracks the PostgreSQL major version. Geography is a
    # first-class dimension of the product (principle 6), so PostGIS is part
    # of the baseline rather than an optional add-on.
    image: postgis/postgis:18-3.6
    container_name: chronolignee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chronolignee
      POSTGRES_PASSWORD: chronolignee_dev_only
      POSTGRES_DB: chronolignee
      # Deterministic collation so name normalisation behaves identically
      # across developer machines and CI.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=fr-FR --encoding=UTF8'
    ports:
      - '5434:5432'
    volumes:
      # PostgreSQL 18 images changed convention: the mount belongs at
      # /var/lib/postgresql (data lands in a version subdirectory), which is
      # what makes `pg_upgrade --link` possible later. Mounting /data directly
      # makes an 18+ container refuse to start.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chronolignee -d chronolignee']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8-alpine
    container_name: chronolignee-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object store. RustFS rather than MinIO: MinIO stopped
  # publishing its community images (quay.io answers 401 and Docker Hub 404,
  # checked October 2026), so a fresh clone could no longer start. The application
  # only speaks plain S3 — put, get, head, delete, presigned GET — and any
  # S3-compatible store will do in production.
  s3:
    image: rustfs/rustfs:1.0.1
    container_name: chronolignee-s3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: chronolignee
      RUSTFS_SECRET_KEY: chronolignee_dev_only
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - s3_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:9000/health']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the archive bucket. A new S3 bucket is private — no
  # policy is attached, so nothing in it is publicly addressable.
  s3-init:
    image: amazon/aws-cli:2.27.50
    container_name: chronolignee-s3-init
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: chronolignee
      AWS_SECRET_ACCESS_KEY: chronolignee_dev_only
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://s3:9000 s3api head-bucket --bucket chronolignee-archives 2>/dev/null ||
      aws --endpoint-url http://s3:9000 s3api create-bucket --bucket chronolignee-archives &&
      echo 'Bucket chronolignee-archives ready (private)'
      "

  # Mail, caught rather than sent. Password resets, address confirmations and
  # invitations are real messages in development: they arrive in Mailpit's
  # inbox (http://localhost:8025) instead of in someone's mailbox, and the
  # end-to-end suite reads them there through its API.
  mailpit:
    image: axllent/mailpit:latest
    container_name: chronolignee-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  s3_data:
