packages:
  - 'apps/*'
  - 'packages/*'

# Explicit allowlist for postinstall scripts. pnpm blocks them by default;
# rather than disabling that protection we name the few packages that
# legitimately compile or fetch a native binary, so any new script-running
# transitive dependency surfaces as a failed install instead of running
# silently.
allowBuilds:
  esbuild: true
  sharp: true
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  unrs-resolver: true
  '@tailwindcss/oxide': true

# Single source of truth for every third-party version in the monorepo.
# Packages reference these with `"dep": "catalog:"` so a version can never
# drift between apps/web and apps/worker.
catalog:
  # --- Runtime / language -------------------------------------------------
  typescript: 5.9.3
  '@types/node': 22.20.2
  tsx: 4.23.13

  # --- Web ----------------------------------------------------------------
  next: 16.3.5
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  next-intl: 4.14.5

  # --- Styling / UI -------------------------------------------------------
  tailwindcss: 4.3.3
  '@tailwindcss/postcss': 4.3.3
  postcss: 8.5.28
  '@radix-ui/react-dialog': 1.1.23
  '@radix-ui/react-dropdown-menu': 2.1.24
  '@radix-ui/react-popover': 1.1.23
  '@radix-ui/react-tooltip': 1.2.16
  '@radix-ui/react-tabs': 1.1.21
  '@radix-ui/react-slider': 1.4.7
  '@radix-ui/react-select': 2.3.7
  '@radix-ui/react-switch': 1.3.7
  '@radix-ui/react-label': 2.1.15
  '@radix-ui/react-visually-hidden': 1.2.11
  clsx: 2.1.1
  tailwind-merge: 3.7.0

  # --- Motion -------------------------------------------------------------
  motion: 13.3.0
  gsap: 3.15.0

  # --- Data / state -------------------------------------------------------
  zustand: 5.0.15
  '@tanstack/react-query': 5.102.8
  zod: 4.6.5

  # --- Database -----------------------------------------------------------
  # Pinned to 7.x on purpose: the `latest` dist-tag currently resolves to
  # 8.0.0-rc.x which is release-candidate software. See docs/adr/0002.
  prisma: 7.10.0
  '@prisma/client': 7.10.0

  # --- Auth ---------------------------------------------------------------
  better-auth: 1.7.5

  # --- Engine / graphics --------------------------------------------------
  three: 0.186.0
  '@types/three': 0.186.0
  bitecs: 0.4.0
  graphology: 0.26.0
  graphology-types: 0.24.8
  elkjs: 0.12.0
  comlink: 4.4.2
  d3-scale: 4.0.2
  d3-array: 3.2.4
  '@types/d3-scale': 4.0.9
  '@types/d3-array': 3.2.2

  # --- Maps ---------------------------------------------------------------
  maplibre-gl: 6.9.1

  # --- Jobs / queue -------------------------------------------------------
  bullmq: 6.3.6
  ioredis: 6.0.0

  # --- Storage / media ----------------------------------------------------
  '@aws-sdk/client-s3': 3.1132.0
  '@aws-sdk/s3-request-presigner': 3.1132.0
  sharp: 0.35.4
  pdfjs-dist: 6.3.289
  file-type: 22.1.0

  # --- AI -----------------------------------------------------------------
  '@anthropic-ai/sdk': 0.125.0

  # --- Observability ------------------------------------------------------
  pino: 10.3.1
  pino-pretty: 13.1.3

  # --- Testing ------------------------------------------------------------
  vitest: 5.0.1
  '@vitest/coverage-v8': 5.0.1
  '@testing-library/react': 16.3.3
  '@testing-library/dom': 10.4.2
  '@testing-library/user-event': 14.6.7
  '@playwright/test': 1.63.0
  '@axe-core/playwright': 4.13.0
  fast-check: 4.10.0
  jsdom: 30.0.1

  # --- Lint / format ------------------------------------------------------
  eslint: 10.10.0
  typescript-eslint: 8.70.0
  '@eslint/js': 10.0.1
  eslint-config-prettier: 10.1.8
  eslint-plugin-react-hooks: 7.1.1
  prettier: 3.9.6
  prettier-plugin-tailwindcss: 0.8.1

minimumReleaseAgeExclude:
  - '@vitest/coverage-v8@5.0.1'
  - '@vitest/mocker@5.0.1'
  - '@vitest/spy@5.0.1'
  - vitest@5.0.1
