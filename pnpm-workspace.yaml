packages:
  - 'apps/*'
  - 'packages/*'

# Explicit allowlist for postinstall scripts. pnpm blocks them by default;
# rather than disabling that protection we name the few packages that
# legitimately compile or fetch a native binary, so any new script-running
# transitive dependency surfaces as a failed install instead of running
# silently.
allowBuilds:
  esbuild: true
  sharp: true
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  unrs-resolver: true
  '@tailwindcss/oxide': true
  # Next.js native toolchain.
  '@swc/core': true
  '@parcel/watcher': true
  # BullMQ's optional native msgpack accelerator. Linux-only, so it never
  # surfaced during Windows development and only appeared in the container
  # build — which is exactly what the container build is for.
  msgpackr-extract: true

# Single source of truth for every third-party version in the monorepo.
# Packages reference these with `"dep": "catalog:"` so a version can never
# drift between apps/web and apps/worker.
catalog:
  # --- Runtime / language -------------------------------------------------
  typescript: 5.9.3
  '@types/node': 22.20.2
  tsx: 4.23.13

  # --- Web ----------------------------------------------------------------
  next: 16.3.5
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  next-intl: 4.14.5

  # --- Styling / UI -------------------------------------------------------
  tailwindcss: 4.3.3
  '@tailwindcss/postcss': 4.3.3
  postcss: 8.5.28
  clsx: 2.1.1
  tailwind-merge: 3.7.0

  # --- Validation ---------------------------------------------------------
  zod: 4.6.5

  # --- Database -----------------------------------------------------------
  # Pinned to 7.x on purpose: the `latest` dist-tag currently resolves to
  # 8.0.0-rc.x which is release-candidate software. See docs/adr/0002.
  prisma: 7.10.0
  '@prisma/client': 7.10.0
  # Prisma 7 removed `url` from the datasource block: the client now talks
  # to the database through a driver adapter. See docs/adr/0002.
  '@prisma/adapter-pg': 7.10.0
  pg: 8.23.0
  '@types/pg': 8.23.1

  # --- Auth ---------------------------------------------------------------
  better-auth: 1.7.5

  # --- Engine / graphics --------------------------------------------------
  three: 0.186.0
  '@types/three': 0.186.0

  # --- Maps ---------------------------------------------------------------
  maplibre-gl: 6.9.1

  # --- Jobs / queue -------------------------------------------------------
  bullmq: 6.3.6

  # --- Mail ---------------------------------------------------------------
  nodemailer: 10.0.10

  # --- Storage / media ----------------------------------------------------
  '@aws-sdk/client-s3': 3.1132.0
  '@aws-sdk/s3-request-presigner': 3.1132.0
  file-type: 22.1.0

  # --- AI -----------------------------------------------------------------
  '@anthropic-ai/sdk': 0.125.0

  # --- Observability ------------------------------------------------------
  pino: 10.3.1
  pino-pretty: 13.1.3
  # Traces, only when OTEL_ENABLED: @vercel/otel is the registration Next.js
  # documents; the rest are its peer dependencies, pinned together.
  '@vercel/otel': 2.1.3
  '@opentelemetry/api': 1.9.1
  '@opentelemetry/api-logs': 0.222.0
  '@opentelemetry/sdk-logs': 0.222.0
  '@opentelemetry/instrumentation': 0.222.0
  '@opentelemetry/resources': 2.11.0
  '@opentelemetry/sdk-metrics': 2.11.0
  '@opentelemetry/sdk-trace-base': 2.11.0
  # Errors, only when SENTRY_DSN is set.
  '@sentry/node': 10.75.0

  # --- Testing ------------------------------------------------------------
  vitest: 5.0.1
  '@vitest/coverage-v8': 5.0.1
  '@playwright/test': 1.63.0
  '@axe-core/playwright': 4.13.0
  fast-check: 4.10.0

  # --- Lint / format ------------------------------------------------------
  eslint: 10.10.0
  typescript-eslint: 8.70.0
  '@eslint/js': 10.0.1
  eslint-config-prettier: 10.1.8
  eslint-plugin-react-hooks: 7.1.1
  prettier: 3.9.6
  prettier-plugin-tailwindcss: 0.8.1

minimumReleaseAgeExclude:
  - '@vitest/coverage-v8@5.0.1'
  - '@vitest/mocker@5.0.1'
  - '@vitest/spy@5.0.1'
  - vitest@5.0.1
  - '@better-auth/core@1.7.5'
  - '@better-auth/drizzle-adapter@1.7.5'
  - '@better-auth/kysely-adapter@1.7.5'
  - '@better-auth/memory-adapter@1.7.5'
  - '@better-auth/mongo-adapter@1.7.5'
  - '@better-auth/prisma-adapter@1.7.5'
  - '@better-auth/telemetry@1.7.5'
  - better-auth@1.7.5
